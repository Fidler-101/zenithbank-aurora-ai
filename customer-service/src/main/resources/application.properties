# ============================================================
# ZenithBank | Customer Service
# Covers: registration, OTP, admin approval, JWT login
# ============================================================

server.port=8081
spring.application.name=customer-service

# ---- PostgreSQL ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zenithbank_customer}
spring.datasource.username=${DB_USERNAME:zenithbank_user}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- Gmail SMTP ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:fidoolarfidler@gmail.com}
spring.mail.password=${MAIL_PASSWORD:cnctabersyezxkkw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:ZenithBankSuperSecretKeyForJWTSigning2026MustBe256BitsLong!}
app.jwt.expiry-ms=3600000

# ---- Admin ----
app.admin.email=${ADMIN_EMAIL:admin@zenithbank.co.za}

# ---- Thymeleaf ----
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ---- Eureka ----
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---- Async ----
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Logging ----
logging.level.com.zenithbank=INFO

# ---- Redis (JTI denylist + rate limiting) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# ---- JWT (RS256) ----
app.jwt.issuer=https://auth.zenithbank.co.za
app.jwt.audience=zenithbank-api
app.jwt.access-token-expiry-ms=900000
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:./keys/private_key.pem}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:./keys/public_key.pem}

management.endpoint.health.show-details=always

# Set to false to disable security during testing
app.security.enabled=true
