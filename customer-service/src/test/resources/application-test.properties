# ============================================================
# Customer Service — Test Configuration
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Disable Eureka and Redis during tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.issuer=https://auth.zenithbank.co.za
app.jwt.audience=zenithbank-api
app.jwt.access-token-expiry-ms=900000
app.jwt.private-key-path=./keys/private_key.pem
app.jwt.public-key-path=./keys/public_key.pem
