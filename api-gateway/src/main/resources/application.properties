# ============================================================
# ZenithBank | API Gateway — port 8080
# ============================================================

server.port=8080
spring.application.name=api-gateway

# ---- Eureka ----
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---- JWT (RS256 public key — verifies tokens signed by customer-service) ----
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:./keys/public_key.pem}
app.jwt.issuer=https://auth.zenithbank.co.za
app.jwt.audience=zenithbank-api

# ---- Redis — shared rate limiter ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# ---- Gateway rate limiting (Redis-backed) ----
# 10 requests/sec steady, burst of 20 per client IP
spring.cloud.gateway.default-filters[0]=RequestRateLimiter=\
  redis-rate-limiter.replenishRate=10,\
  redis-rate-limiter.burstCapacity=20,\
  redis-rate-limiter.requestedTokens=1

# ---- CORS ----
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=\
  http://localhost:3000,http://localhost:8080
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=\
  GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=never

# ---- Logging ----
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.zenithbank.gateway=DEBUG
logging.level.reactor.netty=WARN

# ---- Service Switch Admin ----
app.admin.switch-key=${ADMIN_SWITCH_KEY:zenith-admin-2026}
