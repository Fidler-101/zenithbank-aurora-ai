apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zenithbank
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: ${REGISTRY}/zenithbank-frontend:${TAG}
          ports: [{containerPort: 80}]

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zenithbank
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]

---
# Requires an ingress controller (e.g. ingress-nginx) already
# installed in the cluster — `kubectl get ingressclass` to check.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zenithbank-ingress
  namespace: zenithbank
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: {name: api-gateway, port: {number: 8080}}
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service: {name: frontend, port: {number: 80}}
