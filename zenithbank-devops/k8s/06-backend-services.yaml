# ============================================================
# customer-service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: zenithbank
spec:
  replicas: 2
  selector:
    matchLabels: {app: customer-service}
  template:
    metadata:
      labels: {app: customer-service}
    spec:
      containers:
        - name: customer-service
          image: ${REGISTRY}/zenithbank-customer-service:${TAG}
          ports: [{containerPort: 8081}]
          envFrom:
            - configMapRef: {name: zenithbank-config}
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/zenithbank_customer"}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: DB_USER}}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: DB_PASSWORD}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: REDIS_PASSWORD}}
            - name: SPRING_MAIL_USERNAME
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: SMTP_EMAIL}}
            - name: SPRING_MAIL_PASSWORD
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: SMTP_APP_PASSWORD}}
          volumeMounts:
            - {name: jwt-keys, mountPath: /app/keys, readOnly: true}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8081}
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8081}
            initialDelaySeconds: 50
            periodSeconds: 20
      volumes:
        - name: jwt-keys
          secret: {secretName: zenithbank-jwt-keys}

---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: zenithbank
spec:
  selector: {app: customer-service}
  ports: [{port: 8081, targetPort: 8081}]

