apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: zenithbank
data:
  init-multiple-dbs.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE zenithbank_customer OWNER $POSTGRES_USER;
        CREATE DATABASE zenithbank_banking  OWNER $POSTGRES_USER;
        CREATE DATABASE zenithbank_payment  OWNER $POSTGRES_USER;
    EOSQL

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: zenithbank
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: postgres}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: DB_PASSWORD}}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
            - {name: init-script, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "$(POSTGRES_USER)"]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-script
          configMap: {name: postgres-init, defaultMode: 0755}
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: zenithbank
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
