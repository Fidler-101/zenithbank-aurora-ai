apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: zenithbank
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: ${REGISTRY}/zenithbank-api-gateway:${TAG}
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: zenithbank-config}
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: zenithbank-secrets, key: REDIS_PASSWORD}}
          volumeMounts:
            - {name: jwt-keys, mountPath: /app/keys, readOnly: true}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: jwt-keys
          secret: {secretName: zenithbank-jwt-keys}

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: zenithbank
spec:
  type: LoadBalancer
  selector: {app: api-gateway}
  ports: [{port: 8080, targetPort: 8080}]
