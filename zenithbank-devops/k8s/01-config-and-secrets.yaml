# ============================================================
# Non-secret configuration, shared across services via envFrom.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: zenithbank-config
  namespace: zenithbank
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  BANKING_SERVICE_URL: "http://banking-service:7777"
  PAYMENT_SERVICE_URL: "http://payment-service:8085"
  CUSTOMER_SERVICE_URL: "http://customer-service:8081"
  TRANSACTION_STATUS_URL: "http://transaction-status-service:8087"
  LLM_BACKEND: "ollama"
  APP_SECURITY_ENABLED: "true"

---
# ============================================================
# SECRET TEMPLATE — do not fill this in and commit it.
#
# Generate the real Secret imperatively instead, so nothing
# sensitive ever touches source control:
#
#   kubectl create secret generic zenithbank-secrets -n zenithbank \
#     --from-literal=DB_USER=zenithbank_user \
#     --from-literal=DB_PASSWORD='<real password>' \
#     --from-literal=REDIS_PASSWORD='<real password>' \
#     --from-literal=SMTP_EMAIL='<gmail address>' \
#     --from-literal=SMTP_APP_PASSWORD='<gmail app password>' \
#     --from-literal=ANTHROPIC_API_KEY='<key, if using Claude backend>'
#
#   kubectl create secret generic zenithbank-jwt-keys -n zenithbank \
#     --from-file=private_key.pem=./keys/private_key.pem \
#     --from-file=public_key.pem=./keys/public_key.pem
#
# This file documents the *shape* only.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: zenithbank-secrets
  namespace: zenithbank
type: Opaque
stringData:
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  SMTP_EMAIL: "REPLACE_ME"
  SMTP_APP_PASSWORD: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
