name: ZenithBank CI/CD

# Copy this file to .github/workflows/ci-cd.yml at the root of your repo
# (the root that contains eureka-server/, api-gateway/, customer-service/, etc.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:

  # ---------------------------------------------------------
  # 1. Test every Java service independently. A failure here
  #    stops the pipeline before anything gets built or deployed.
  # ---------------------------------------------------------
  test-java-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - customer-service
          - banking-service
          - payment-service
          - transaction-status-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: mvn -B test

  # ---------------------------------------------------------
  # 2. Test AuroraAI (Python)
  # ---------------------------------------------------------
  test-aurora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: aurora-ai-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: aurora-ai-service
        run: pytest -v

  # ---------------------------------------------------------
  # 3. Build & push a Docker image per service — only after
  #    tests pass, and only on pushes to main (not on PRs).
  # ---------------------------------------------------------
  build-and-push:
    needs: [test-java-services, test-aurora]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - customer-service
          - banking-service
          - payment-service
          - transaction-status-service
          - aurora-ai-service
          - zb-microfrontends
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/zenithbank-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/zenithbank-${{ matrix.service }}:latest

  # ---------------------------------------------------------
  # 4. Deploy — SSH into your EC2 box and redeploy with
  #    docker-compose using the images just pushed.
  #
  #    Requires these repo secrets (Settings -> Secrets -> Actions):
  #      EC2_HOST        the instance's public IP or DNS name
  #      EC2_SSH_KEY      contents of your .pem private key
  #      EC2_USER        e.g. "ubuntu"
  # ---------------------------------------------------------
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/zenithbank
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
