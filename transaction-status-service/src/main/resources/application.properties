# ============================================================
# ZenithBank | Transaction Status Service
# ============================================================

server.port=8087
spring.application.name=transaction-status-service

# No own database — this service is a pure aggregator

# ---- Eureka ----
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---- Feign timeouts ----
feign.client.config.banking-service.connect-timeout=3000
feign.client.config.banking-service.read-timeout=5000
feign.client.config.payment-service.connect-timeout=3000
feign.client.config.payment-service.read-timeout=5000

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Logging ----
logging.level.com.zenithbank=INFO

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
