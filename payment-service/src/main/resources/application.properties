# ============================================================
# ZenithBank | Payment Service
# ============================================================

server.port=8085
spring.application.name=payment-service

# ---- PostgreSQL ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zenithbank_payment}
spring.datasource.username=${DB_USERNAME:zenithbank_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- Eureka ----
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---- Feign — banking-service inter-service calls ----
feign.client.config.banking-service.connect-timeout=5000
feign.client.config.banking-service.read-timeout=10000

# ---- Scheduler ----
spring.task.scheduling.pool.size=2

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Logging ----
logging.level.com.zenithbank=INFO

