<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'none'">
<title>ZenithBank — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/zb-common.js"></script>
<style>
.auth-wrap{min-height:100vh; display:flex;}
.auth-hero{flex:1.1; position:relative; color:#fff; display:flex; flex-direction:column; justify-content:space-between; padding:48px; overflow:hidden;}
.auth-hero .brand{font-size:22px; font-weight:700; display:flex; align-items:center; gap:10px;}
.auth-hero .hero-copy h1{font-size:40px; line-height:1.15; font-weight:600; max-width:460px; margin:0 0 16px;}
.auth-hero .hero-copy p{font-size:15px; color:rgba(255,255,255,0.82); max-width:420px; line-height:1.6;}
.auth-hero .hero-foot{font-size:12.5px; color:rgba(255,255,255,0.6);}
.auth-panel{flex:1; display:flex; align-items:center; justify-content:center; padding:32px; background:var(--paper);}
.auth-card{width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:32px; box-shadow:var(--shadow-md);}
.auth-tabs{display:flex; gap:4px; background:#eef1f6; padding:4px; border-radius:10px; margin-bottom:24px;}
.auth-tab{flex:1; text-align:center; padding:9px 0; border:none; background:transparent; border-radius:8px; font-weight:600; font-size:13.5px; color:var(--muted); cursor:pointer;}
.auth-tab.active{background:#fff; color:var(--navy-900); box-shadow:var(--shadow-sm);}
.otp-boxes{display:flex; gap:8px; margin-bottom:8px;}
.otp-boxes input{width:44px; height:52px; text-align:center; font-size:20px; font-weight:600; border:1px solid var(--line); border-radius:9px;}
.otp-boxes input:focus{border-color:var(--emerald); box-shadow:0 0 0 3px rgba(22,166,127,0.12); outline:none;}
.status-card{text-align:center; padding:8px 4px 4px;}
.status-icon{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:22px;}
.status-icon.pending{background:var(--warn-bg); color:var(--warn);}
.status-icon.success{background:var(--success-bg); color:var(--emerald-dark);}
@media (max-width: 860px){ .auth-hero{display:none;} }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-hero aurora-surface">
    <div class="brand"><i class="fa-solid fa-shield-halved"></i> ZenithBank</div>
    <div class="hero-copy">
      <h1>Banking that explains itself.</h1>
      <p>This screen belongs to <strong>customer-service</strong> — registration, OTP verification and login. Once you're in, you're hand off to the banking, payments, and Aurora AI apps.</p>
    </div>
    <div class="hero-foot">Secured with RS256-signed sessions · OTP-verified onboarding</div>
  </div>
  <div class="auth-panel"><div class="auth-card" id="auth-card"></div></div>
</div>

<script src="./app.js"></script>
</body>
</html>
