<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'none'">
<title>ZenithBank — Aurora AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/zb-common.js"></script>
<style>
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 220px); min-height:420px;}
.chat-log{flex:1; overflow-y:auto; padding:6px 2px 16px; display:flex; flex-direction:column; gap:12px;}
.msg{max-width:72%; padding:12px 15px; border-radius:14px; font-size:13.5px; line-height:1.55;}
.msg.user{align-self:flex-end; background:var(--navy-900); color:#fff; border-bottom-right-radius:4px;}
.msg.bot{align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px;}
.msg.bot .meta{font-size:10.5px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:0.3px;}
.typing{display:flex; gap:4px; padding:4px 0;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;}}
.chat-input{display:flex; gap:10px; margin-top:14px;}
.chat-input input{flex:1; padding:13px 16px; border-radius:24px; border:1px solid var(--line); font-size:13.5px;}
.chat-input input:focus{border-color:var(--emerald); box-shadow:0 0 0 3px rgba(22,166,127,0.12); outline:none;}
.chat-input button{border-radius:50%; width:46px; height:46px; padding:0;}
.chat-suggest{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.chip{border:1px solid var(--line); background:#fff; border-radius:20px; padding:7px 13px; font-size:12px; font-weight:600; color:var(--navy-900); cursor:pointer;}
.chip:hover{border-color:var(--emerald); color:var(--emerald-dark);}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div class="topbar">
      <div><h2>Aurora AI</h2><div class="sub">aurora-ai-service · read-only, plain-English answers about your account</div></div>
    </div>
    <div class="content">
      <div class="chat-wrap view">
        <div class="chat-suggest">
          <button class="chip" data-q="What's my current balance?">What's my current balance?</button>
          <button class="chip" data-q="Show my last 5 transactions">Last 5 transactions</button>
          <button class="chip" data-q="How much did I spend this month?">Spend this month</button>
          <button class="chip" data-q="Any large transactions recently?">Large transactions</button>
        </div>
        <div class="chat-log" id="chat-log"></div>
        <form class="chat-input" id="chat-form">
          <input name="msg" placeholder="Ask Aurora about your account…" autocomplete="off">
          <button class="btn btn-accent" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
