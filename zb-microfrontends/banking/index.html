<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' http://localhost:8080; object-src 'none'; base-uri 'none'">
<title>ZenithBank — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/zb-common.js"></script>
<style>
.balance-card{color:#fff; border-radius:18px; padding:26px; position:relative; overflow:hidden; box-shadow:var(--shadow-md);}
.balance-card .label{font-size:12.5px; opacity:0.85; font-weight:600; letter-spacing:0.3px;}
.balance-card .amount{font-size:38px; font-weight:700; margin:8px 0 2px; font-variant-numeric:tabular-nums;}
.balance-card .acc{font-size:12.5px; opacity:0.85;}
.balance-card .pill{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.16); padding:5px 10px; border-radius:20px; font-size:11.5px; font-weight:600; margin-top:14px;}
.quick-actions{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:18px;}
.qa{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 10px; text-align:center; text-decoration:none; display:block; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
.qa:hover{transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:transparent;}
.qa i{font-size:17px; color:var(--emerald-dark); margin-bottom:8px; display:block;}
.qa span{font-size:12px; font-weight:600; color:var(--text);}
.tabbar{display:flex; gap:4px; background:#eef1f6; padding:4px; border-radius:10px; margin:26px 0 18px; width:fit-content;}
.tabbtn{padding:8px 16px; border:none; background:transparent; border-radius:8px; font-weight:600; font-size:13px; color:var(--muted); cursor:pointer;}
.tabbtn.active{background:#fff; color:var(--navy-900); box-shadow:var(--shadow-sm);}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div class="topbar">
      <div><h2>Dashboard</h2><div class="sub" id="topbar-sub">banking-service · live account overview</div></div>
      <button class="btn btn-ghost" id="refresh-btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
