[pytest]
testpaths = tests

python_files   = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit:        Unit tests — isolated, no DB or network
    integration: Integration tests — agents communicating with mock DB
    system:      System tests — full HTTP endpoint testing via TestClient
    acceptance:  Acceptance tests — spec section 10.3 scenarios

addopts = -v --tb=short --strict-markers

log_cli       = true
log_cli_level = WARNING
